.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}

.row{display:flex;gap:8px}.row>*{flex:1}
label{display:block;color:var(--mut);font-size:12px;margin:10px 2px 4px}
.btn{width:100%;border:0;background:var(--pri);color:#fff;font:800 17px Vazirmatn,Tahoma;padding:15px;border-radius:14px;margin-top:14px}
.btn.s{background:var(--chip);color:var(--tx);font-size:14px;font-weight:600;padding:11px}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 2px;font:inherit;font-size:11px}
nav button b{display:block;font-size:20px}nav button.on{color:var(--pri);font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--chip);border-radius:14px;padding:12px}.k small{color:var(--mut);font-size:12px}.k div{font-weight:800;font-size:17px;margin-top:2px}
.pos{color:var(--inc)}.neg{color:var(--exp)}
.bar{height:9px;background:var(--chip);border-radius:9px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}

.line{display:flex;justify-content:space-between;font-size:13px}
.mon{display:flex;justify-content:space-between;align-items:center}.mon button{border:0;background:var(--chip);color:var(--tx);width:38px;height:38px;border-radius:12px;font-size:18px}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}

.day{color:var(--mut);font-size:12px;margin:14px 2px 0}

svg text{fill:var(--mut);font-size:10px;font-family:inherit}
.seg button{font-size:13px;padding:10px 2px}

.ov{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end}.sheet{background:var(--card);width:100%;max-width:560px;margin:auto;border-radius:20px 20px 0 0;padding:16px;max-height:90vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.tx{cursor:pointer}
.chip.sc{border-color:var(--pri);color:var(--pri);font-weight:600}

body{overscroll-behavior-y:contain}

 return `<div class="card"><b>نصب روی گوشی</b><div class="sub" style="margin:6px 0">${st?"✓ الان به‌صورت اپ نصب‌شده باز شده است.":DIP?"می‌توانید همین الان نصبش کنید.":ios?"در Safari: دکمهٔ اشتراک‌گذاری (مربع با فلش) ← Add to Home Screen. داخل تلگرام یا اینستاگرام این گزینه نیست؛ لینک را در Safari باز کنید.":"در Chrome: منوی سه‌نقطه ← Install app یا Add to Home screen. داخل تلگرام این گزینه نیست؛ لینک را در Chrome باز کنید."}</div>${DIP&&!st?'<button class="btn s" style="margin-top:0" onclick="inst()">نصب اپ</button>':""}<div class="sub" style="margin-top:8px;direction:ltr;text-align:left">manifest: ${!!document.querySelector("link[rel=manifest]")} · https: ${location.protocol=="https:"} · service worker: ${"serviceWorker" in navigator} · persistent storage: ${PST}</div></div>`}
function quickSett(){const T4=[["e","هزینه"],["i","درآمد"],["l","دادم"],["b","گرفتم"]],ao=a=>S.accounts.map(x=>`<option${x.n==a?" selected":""}>${x.n}</option>`).join("");
 return `<div class="card"><b>میان‌بُرهای ثبت سریع</b><div class="sub" style="margin:4px 0">هر میان‌بُر یک دکمه در صفحهٔ «ثبت» می‌سازد. «ثبت فوری» یعنی با یک لمس همان لحظه ثبت شود (مبلغ و دسته لازم است).</div>${S.quick.map((q,i)=>`<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:8px"><div class="row"><input style="flex:0 0 58px;text-align:center" value="${esc(q.ic||"")}" placeholder="🙂" onchange="qk(${i},'ic',this.value)"><input value="${esc(q.n)}" placeholder="نام دکمه" onchange="qk(${i},'n',this.value)"><select onchange="qk(${i},'t',this.value)">${T4.map(([k,v])=>`<option value="${k}"${q.t==k?" selected":""}>${v}</option>`).join("")}</select></div><div class="row" style="margin-top:6px"><input inputmode="numeric" value="${q.a?fa(q.a):""}" placeholder="مبلغ (اختیاری)" onchange="qk(${i},'a',this.value)">${q.t=="l"||q.t=="b"?`<input value="${esc(q.p)}" placeholder="نام شخص" onchange="qk(${i},'p',this.value)">`:`<select onchange="qk(${i},'c',this.value)"><option value=""></option>${(S.cats[q.t]||[]).map(x=>`<option${x==q.c?" selected":""}>${x}</option>`).join("")}</select>`}</div><div class="row" style="margin-top:6px"><select onchange="qk(${i},'acc',this.value)">${ao(q.acc)}</select><input value="${esc(q.note)}" placeholder="توضیح" onchange="qk(${i},'note',this.value)"></div><div class="row" style="margin-top:6px"><select onchange="qk(${i},'col',this.value)"><option value="">رنگ پیش‌فرض</option>${[["#0f8b8d","سبزآبی"],["#2563eb","آبی"],["#7c3aed","بنفش"],["#db2777","صورتی"],["#ea580c","نارنجی"],["#16a34a","سبز"],["#d24545","قرمز"]].map(([v,n])=>`<option value="${v}"${q.col==v?" selected":""}>${n}</option>`).join("")}</select><button class="chip" style="flex:0 0 44px" onclick="qMv(${i},-1)">↑</button><button class="chip" style="flex:0 0 44px" onclick="qMv(${i},1)">↓</button></div><div class="row" style="margin-top:6px;align-items:center"><label style="display:flex;gap:6px;margin:0;align-items:center"><input type="checkbox" style="width:auto"${q.now?" checked":""} onchange="qk(${i},'now',this.checked)"> ثبت فوری</label><button class="chip" style="flex:0 0 44px" onclick="qDel(${i})">✕</button></div></div>`).join("")}<button class="btn s" onclick="qAdd()">＋ میان‌بُر جدید</button><label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" style="width:auto"${S.autoSug!==false?" checked":""} onchange="S.autoSug=this.checked;persist();drawForm()"> نمایش خودکار پرکاربردها</label><label>تعداد پرکاربردهای خودکار</label><select onchange="S.autoN=+this.value;persist();drawForm()">${[0,3,6,8,10].map(n=>`<option${(S.autoN==null?6:S.autoN)==n?" selected":""}>${n}</option>`).join("")}</select><div class="sub" style="margin-top:8px">نکته: در صفحهٔ «ثبت» روی هر میان‌بُر نگه دارید تا به همین‌جا بیایید.</div></div>`}
window.qk=(i,k,v)=>{S.quick[i][k]=k=="a"?(+norm(v)||0):k=="now"?!!v:String(v).trim();if(k=="t"){S.quick[i].c="";S.quick[i].p=""}persist();drawForm();if(k!="now")sett()};
window.qMv=(i,d)=>{const j=i+d;if(j<0||j>=S.quick.length)return;[S.quick[i],S.quick[j]]=[S.quick[j],S.quick[i]];persist();drawForm();sett()};
window.qAdd=()=>{S.quick.push({id:Date.now(),n:"میان‌بُر جدید",t:"e",a:0,c:"",p:"",acc:S.accounts[0].n,note:"",g:"",now:false});persist();sett()};
window.qDel=i=>{S.quick.splice(i,1);persist();drawForm();sett()};
function personalSett(){const sw=["#0f8b8d","#2563eb","#7c3aed","#db2777","#ea580c","#16a34a"],cur=S.accent||sw[0];
 return `<div class="card"><b>ظاهر و چیدمان</b><label>رنگ اصلی</label><div class="chips">${sw.map(c=>`<button class="chip" style="background:${c};border:${c==cur?"3px solid var(--tx)":"1px solid var(--line)"};width:38px;height:38px;padding:0" onclick="setAcc('${c}')"></button>`).join("")}</div><label>صفحهٔ شروع</label><select onchange="S.start=this.value;persist()">${[["add","ثبت"],["dash","داشبورد"],["list","تراکنش‌ها"],["deb","طلب‌ها"]].map(([k,v])=>`<option value="${k}"${(S.start||"add")==k?" selected":""}>${v}</option>`).join("")}</select><label>بخش‌های داشبورد (تیک بردارید تا پنهان شود)</label>${[["ins","خلاصهٔ هوشمند"],["kpi","درآمد و هزینهٔ ماه"],["day","هزینه روزبه‌روز"],["week","هفته‌ها"],["acc","موجودی حساب‌ها"],["cat","هزینه به تفکیک دسته"],["fix","هزینه‌های ثابت"],["debt","طلب و بدهی"],["hab","عادت‌های خرج‌کردن"],["six","۶ ماه اخیر"]].map(([k,v])=>`<label style="display:flex;gap:8px;align-items:center;margin:4px 0;color:var(--tx);font-size:14px"><input type="checkbox" style="width:auto"${S.sec&&S.sec[k]===0?"":" checked"} onchange="(S.sec=S.sec||{})['${k}']=this.checked?1:0;persist()"> ${v}</label>`).join("")}</div>`}
window.setAcc=c=>{S.accent=c;persist();applyAcc();sett()};
function applyAcc(){const c=S.accent||"#0f8b8d";document.documentElement.style.setProperty("--pri",c);const m=document.querySelector("meta[name=theme-color]");if(m)m.content=c}
function sett(){
 $("#v-set").innerHTML=`${installCard()}<div class="card"><b>سقف هزینهٔ ماهانه (اختیاری)</b><input id="lim" inputmode="numeric" value="${S.limit?fa(S.limit):""}" placeholder="خالی = جمع بودجه‌های دسته‌ها" style="margin-top:8px"><div class="sub" style="margin-top:6px">برای محاسبهٔ «مبلغ مجاز خرج امروز» در داشبورد.</div></div>
 <div class="card"><b>نرخ پیش‌فرض دلار (تومان)</b><input id="rate" inputmode="numeric" value="${fa(S.rate)}" style="margin-top:8px"><div class="sub" style="margin-top:6px">این عدد فقط پیش‌فرض است. در صفحهٔ ثبت، برای هر تراکنش می‌توانید نرخ را عوض کنید و همان نرخ با تراکنش ذخیره می‌شود.</div></div>
 <div class="card"><b>حساب‌ها و موجودی اولیه</b>${S.accounts.map((a,i)=>`<div class="row" style="margin-top:8px"><input value="${a.n}" onchange="acc(${i},'n',this.value)"><input inputmode="numeric" value="${fa(a.open)}" onchange="acc(${i},'open',this.value)"><button class="chip" style="flex:0 0 44px" onclick="accDel(${i})">✕</button></div>`).join("")}<button class="btn s" onclick="addAcc()">＋ حساب جدید</button></div>
 <div class="card"><b>بودجهٔ ماهانهٔ هر دسته (تومان)</b>${S.cats.e.map(c=>`<div class="row" style="margin-top:8px"><div style="align-self:center">${c}</div><input inputmode="numeric" value="${S.budgets[c]?fa(S.budgets[c]):""}" placeholder="بدون بودجه" onchange="bud('${c}',this.value)"></div>`).join("")}</div>
 ${quickSett()}${personalSett()}${fixedSett()}<div class="card"><b>نوع هزینه (ضروری، احساسی و …)</b><div class="sub" style="margin:4px 0">چهار نوع اصلی پیش‌فرض‌اند؛ هر چه خواستید اضافه یا حذف کنید (با ویرگول جدا کنید).</div><input id="tg" value="${S.tags.join("،")}"><button class="btn s" onclick="saveTags()">ذخیرهٔ انواع</button></div>
 <div class="card"><b>دسته‌بندی‌ها</b><label>هزینه (با ویرگول جدا کنید)</label><input id="ce" value="${S.cats.e.join("،")}"><label>درآمد</label><input id="ci" value="${S.cats.i.join("،")}"><button class="btn s" onclick="saveCats()">ذخیرهٔ دسته‌ها</button></div>
 <div class="card"><b>پشتیبان‌گیری و انتقال بین دستگاه‌ها</b><div class="sub" style="margin:4px 0 8px">فایل پشتیبان را روی یک دستگاه بگیرید و روی دستگاه دیگر «بازیابی» کنید. فایل Excel برای بازیابی قابل استفاده نیست.</div><div class="sub" style="margin-bottom:8px">${S.lastBackup?"آخرین پشتیبان: "+fa((Date.now()-S.lastBackup)/864e5)+" روز پیش":"هنوز پشتیبان نگرفته‌اید"}</div><button class="btn s" style="margin-top:0" onclick="bk()">ذخیرهٔ پشتیبان</button><label class="btn s" style="display:block;text-align:center;margin-top:8px">بازیابی از فایل پشتیبان<input type="file" accept=".json,application/json" hidden onchange="rs(this)"></label></div>
 <button class="btn s" onclick="exp()">دانلود Excel</button>`;
 $("#lim").onchange=e=>{S.limit=+norm(e.target.value)||0;persist();toast("ذخیره شد")};
 $("#rate").onchange=e=>{const n=+norm(e.target.value);if(n>0){S.rate=n;persist();rateInfo();$("#rt").value=fa(n);showUsd();toast("نرخ ذخیره شد")}sett()};
}
window.acc=(i,k,v)=>{if(k=="open")S.accounts[i].open=+norm(v)||0;else if(v.trim()){const o=S.accounts[i].n;S.accounts[i].n=v.trim();S.tx.forEach(x=>{if(x.acc==o)x.acc=v.trim();if(x.to==o)x.to=v.trim()})}persist();sett()};
window.accDel=i=>{if(S.accounts.length<2)return toast("حداقل یک حساب لازم است");const a=S.accounts[i],u=S.tx.filter(x=>x.acc==a.n||x.to==a.n).length;
 if(!confirm(u?`حساب «${a.n}» ${fa(u)} تراکنش دارد. با حذف حساب، موجودی آن دیگر محاسبه نمی‌شود ولی تراکنش‌ها در فهرست می‌مانند. حذف شود؟`:`حساب «${a.n}» حذف شود؟`))return;
 S.accounts.splice(i,1);persist();sett();drawForm()};
window.addAcc=()=>{S.accounts.push({n:"حساب "+fa(S.accounts.length+1),open:0});persist();sett()};
window.bud=(c,v)=>{S.budgets[c]=+norm(v)||0;persist()};
window.saveCats=()=>{const p=s=>s.split(/[،,]/).map(x=>x.trim()).filter(Boolean);const e=p($("#ce").value),i=p($("#ci").value);if(e.length&&i.length){S.cats={e,i};persist();toast("ذخیره شد");drawForm()}};
// ---- backup / restore
window.bk=()=>saveFile("finance-backup.json",JSON.stringify(S),"application/json");
window.rs=inp=>{const f=inp.files[0];if(!f)return;f.text().then(t=>{try{const v=JSON.parse(t);if(!Array.isArray(v.tx))throw 0;
 if(confirm("همهٔ اطلاعات فعلی با این پشتیبان جایگزین شود؟")){S=Object.assign(def(),v);persist();sett();drawForm();toast("بازیابی شد ✓")}}catch(e){toast("فایل پشتیبان معتبر نیست")}});inp.value=""};
function saveFile(name,data,mime){const u=URL.createObjectURL(new Blob([data],{type:mime}));const l=document.createElement("a");l.href=u;l.download=name;document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
const _bk=window.bk;window.bk=()=>{S.lastBackup=Date.now();persist();_bk()};
// ---- Excel export
window.exp=async()=>{
 if(typeof XLSX=="undefined")return toast("کتابخانهٔ Excel بارگذاری نشد");
 const nm={e:"هزینه",i:"درآمد",t:"انتقال",l:"دادم (طلب)",b:"گرفتم (بدهی/دریافت)"};
 const rows=[...S.tx].sort((a,b)=>a.d.localeCompare(b.d)).map(x=>({"تاریخ شمسی":(p=>p.year+"/"+String(p.month).padStart(2,"0")+"/"+String(p.day).padStart(2,"0"))(pp(x.d)),"تاریخ میلادی":x.d,"نوع":nm[x.t],"مبلغ (تومان)":x.a,"نرخ دلار":x.r,"مبلغ (دلار)":+(x.a/x.r).toFixed(2),"دسته":x.c,"شخص":x.p||"","حساب":x.acc,"به حساب":x.to,"نوع هزینه":x.g,"توضیح":x.n,"احساس":x.f||""}));
 const ks=[...new Set(S.tx.map(x=>key(x.d)))].sort();
 const sm=ks.map(k=>{const l=inM(k),I=sum(l,"i"),E=sum(l,"e");return{"ماه":Math.floor(k/100)+"/"+String(k%100).padStart(2,"0")+" "+MN[k%100-1],"درآمد":I,"هزینه":E,"خالص":I-E,"نرخ پس‌انداز":I?+((I-E)/I).toFixed(3):0}});
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"تراکنش‌ها");
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sm),"خلاصه ماهانه");
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(bal().map(x=>({"حساب":x.n,"موجودی":x.b}))),"حساب‌ها");
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(persons().map(p=>({"شخص":p.n,"مانده":p.net,"وضعیت":p.net>0?"طلب من":p.net<0?"بدهی من":"تسویه"}))),"طلب‌ها");
 wb.Workbook={Views:[{RTL:true}]};
 const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
 saveFile("finance.xlsx",buf,"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
};
// ---- nav
function draw(){["add","dash","list","deb","fc","set"].forEach(v=>$("#v-"+v).classList.toggle("hid",v!=view));
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==view));
 if(view=="dash")dash();if(view=="list")list();if(view=="deb")debts();if(view=="fc")fcView();if(view=="set")sett();if(view=="add")drawForm()}
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b){view=b.dataset.v;draw();scrollTo(0,0)}};
(async()=>{$("#date").value=iso(new Date());ym=key($("#date").value);$("#today").textContent="امروز: "+pstr($("#date").value);drawForm();await load();ym=key($("#date").value);rateInfo();applyAcc();view=S.start||"add";drawForm();draw();0})();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
